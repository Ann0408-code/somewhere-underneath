<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>04 / 時間</title>

  <link
    rel="stylesheet"
    href="../css/global.css"
  >

  <link
    rel="stylesheet"
    href="../css/time.css"
  >
</head>

<body>

  <!--

      timestamps are labels.
      labels are instructions.

      08 has never been a time.

  -->

  <main class="screen time-screen">

    <a
      class="return-button"
      href="../index.html#archive"
    >
      <span class="return-arrow">←</span>
      RETURN
    </a>


    <div class="time-meta">
      TEMPORAL RECORD
    </div>


    <!-- TITLE -->

    <section class="time-heading">

      <div class="archive-number">
        ARCHIVE 04
      </div>

      <h1>
        時間
      </h1>

      <div class="heading-line"></div>

    </section>


    <!-- CENTRAL RECORD -->

    <section class="temporal-record">

      <div class="record-line">

        <button
          class="time-value special-time"
          id="specialTime"
        >
          <span>04</span>
          <span
            class="separator"
            id="specialSeparator"
          >.</span>
          <span>08</span>
        </button>

      </div>


      <div class="vertical-line"></div>


      <div class="record-line">

        <button class="time-value">
          <span>20</span>
          <span class="separator">:</span>
          <span>29</span>
        </button>

      </div>


      <div class="vertical-line"></div>


      <div class="record-line">

        <button class="time-value">
          <span>03</span>
          <span class="separator">:</span>
          <span>17</span>
        </button>

      </div>


      <div class="vertical-line"></div>


      <div class="record-line">

        <button class="time-value">
          <span>03</span>
          <span class="separator">:</span>
          <span>12</span>
        </button>

      </div>

    </section>


    <!-- STATUS PANEL -->

    <aside class="time-inspector">

      <div class="time-inspector-label">
        RECORD ANALYSIS
      </div>


      <div class="analysis-row">

        <span>
          RECORDS
        </span>

        <span>
          4
        </span>

      </div>


      <div class="analysis-row">

        <span>
          VERIFIED
        </span>

        <span id="verifiedCount">
          4
        </span>

      </div>


      <div class="analysis-divider"></div>


      <div class="analysis-row">

        <span>
          SEQUENCE STATUS
        </span>

        <span id="sequenceStatus">
          VALID
        </span>

      </div>


      <div
        class="format-message"
        id="formatMessage"
      ></div>

    </aside>


    <!-- BOTTOM MESSAGE -->

    <div
      class="order-message"
      id="orderMessage"
    >
      ORDER VERIFIED
    </div>

  </main>


  <!-- =====================================================
       CLASSIFICATION
       ===================================================== -->

  <div
    class="classification-overlay"
    id="classificationOverlay"
  >

    <div class="classification-window">

      <div class="classification-label">
        FORMAT RECOVERED
      </div>


      <div class="classification-values">

        <span>04 : 08</span>
        <span>20 : 29</span>
        <span>03 : 17</span>
        <span>03 : 12</span>

      </div>


      <div class="classification-question">
        READ AS
      </div>


      <div class="classification-options">

        <button data-answer="time">
          TIME
        </button>

        <button data-answer="date">
          DATE
        </button>

        <button data-answer="coordinate">
          COORDINATE
        </button>

        <button data-answer="index">
          INDEX
        </button>

      </div>


      <div
        class="classification-response"
        id="classificationResponse"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       REVEAL
       ===================================================== -->

  <div
    class="time-reveal"
    id="timeReveal"
  >

    <div class="time-reveal-content">

      <div
        class="reveal-numbers"
        id="revealNumbers"
      >

        <div>04 <span>:</span> 08</div>
        <div>20 <span>:</span> 29</div>
        <div>03 <span>:</span> 17</div>
        <div>03 <span>:</span> 12</div>

      </div>


      <div
        class="reveal-message"
        id="revealMessage"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       COMPLETION
       ===================================================== -->

  <div
    class="time-completion"
    id="timeCompletion"
  >

    <div class="time-completion-content">

      <div
        id="timeCompleteTop"
      ></div>


      <div
        class="time-complete-main"
        id="timeCompleteMain"
      ></div>


      <div
        class="time-complete-second"
        id="timeCompleteSecond"
      ></div>


      <div
        class="time-complete-access"
        id="timeCompleteAccess"
      ></div>

    </div>

  </div>


  <script src="../js/time.js"></script>

</body>

</html>
