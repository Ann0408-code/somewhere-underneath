<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>06 / ポラリス</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/polaris.css">
</head>

<body>

  <!--
      observation_01

      objects_detected: 08
      objects_tracked: 08

      object_08:
      movement: null
      reference: fixed

      recipient:
      unresolved
  -->

  <main class="screen polaris-screen">

    <a
      class="return-button"
      href="../index.html#archive"
    >
      <span>←</span>
      RETURN
    </a>

    <div class="polaris-meta">
      OBSERVATION LOG
    </div>

    <!-- TITLE -->

    <section class="polaris-heading">

      <div class="archive-number">
        ARCHIVE 06
      </div>

      <h1>ポラリス</h1>

      <div class="heading-line"></div>

    </section>

    <!-- STAR FIELD -->

    <section
      class="observation-field"
      id="observationField"
    >

      <div
        class="star"
        data-object="01"
        data-dx="14"
        data-dy="-7"
        style="--x:18%; --y:27%;"
      ></div>

      <div
        class="star"
        data-object="02"
        data-dx="-9"
        data-dy="11"
        style="--x:34%; --y:16%;"
      ></div>

      <div
        class="star"
        data-object="03"
        data-dx="12"
        data-dy="-4"
        style="--x:73%; --y:23%;"
      ></div>

      <div
        class="star"
        data-object="04"
        data-dx="-11"
        data-dy="-8"
        style="--x:82%; --y:58%;"
      ></div>

      <div
        class="star"
        data-object="05"
        data-dx="8"
        data-dy="13"
        style="--x:61%; --y:76%;"
      ></div>

      <div
        class="star"
        data-object="06"
        data-dx="-13"
        data-dy="6"
        style="--x:27%; --y:72%;"
      ></div>

      <div
        class="star"
        data-object="07"
        data-dx="7"
        data-dy="-12"
        style="--x:12%; --y:51%;"
      ></div>

      <!-- OBJECT 08 / POLARIS -->

      <div
        class="star star-08"
        data-object="08"
        data-dx="0"
        data-dy="0"
        style="--x:51%; --y:45%;"
      ></div>

    </section>

    <!-- OBSERVATION CONTROL -->

    <section class="observation-control">

      <div class="observation-label">
        OBSERVATION 01
      </div>

      <div
        class="observation-time"
        id="observationTime"
      >
        03:17
      </div>

      <button
        class="begin-button"
        id="beginButton"
      >
        BEGIN OBSERVATION
      </button>

    </section>

    <!-- OBJECT INSPECTOR -->

    <aside
      class="object-inspector"
      id="objectInspector"
    >

      <div
        class="inspector-heading"
        id="inspectorHeading"
      >
        OBJECT —
      </div>

      <div class="inspector-divider"></div>

      <div class="inspector-row">
        <span>POSITION</span>
        <span></span>
      </div>

      <div class="inspector-row">
        <span>ΔX</span>
        <span id="deltaX">—</span>
      </div>

      <div class="inspector-row">
        <span>ΔY</span>
        <span id="deltaY">—</span>
      </div>

      <div class="inspector-divider"></div>

      <div class="inspector-row">
        <span>STATUS</span>
        <span id="objectStatus">—</span>
      </div>

      <div
        class="reference-question"
        id="referenceQuestion"
      >

        <div class="reference-label">
          SET REFERENCE?
        </div>

        <div class="reference-options">

          <button id="referenceYes">
            YES
          </button>

          <button id="referenceNo">
            NO
          </button>

        </div>

      </div>

    </aside>

    <!-- GLOBAL STATUS -->

    <aside class="observation-status">

      <div class="status-heading">
        OBSERVATION STATUS
      </div>

      <div class="status-row">
        <span>OBJECTS DETECTED</span>
        <span>08</span>
      </div>

      <div class="status-row">
        <span>OBJECTS TRACKED</span>
        <span>08</span>
      </div>

      <div class="status-divider"></div>

      <div class="status-row">
        <span>MOVEMENT STATUS</span>
        <span id="movementStatus">NORMAL</span>
      </div>

    </aside>

    <div
      class="polaris-bottom"
      id="polarisBottom"
    >
      AWAITING OBSERVATION
    </div>

  </main>

  <!-- =====================================================
       REFERENCE TRANSITION
       ===================================================== -->

  <div
    class="reference-overlay"
    id="referenceOverlay"
  >

    <div class="reference-content">

      <div
        class="reference-object"
        id="referenceObject"
      >
        OBJECT 08
      </div>

      <div
        class="reference-status"
        id="referenceStatus"
      ></div>

      <div
        class="reference-designation"
        id="referenceDesignation"
      ></div>

    </div>

  </div>

  <!-- =====================================================
       MESSAGE / POLARIS
       ===================================================== -->

  <div
    class="message-overlay"
    id="messageOverlay"
  >

    <div class="message-star-wrap">

      <button
        class="message-star"
        id="messageStar"
        aria-label="Polaris"
      ></button>

      <div
        class="personal-message"
        id="personalMessage"
      ></div>

      <div
        class="signal-record"
        id="signalRecord"
      ></div>

    </div>

  </div>

  <!-- =====================================================
       COMPLETION
       ===================================================== -->

  <div
    class="polaris-completion"
    id="polarisCompletion"
  >

    <div class="polaris-completion-content">

      <div
        class="completion-top"
        id="completionTop"
      ></div>

      <div
        class="completion-main"
        id="completionMain"
      ></div>

      <div
        class="completion-recipient"
        id="completionRecipient"
      ></div>

      <div
        class="completion-access"
        id="completionAccess"
      ></div>

    </div>

  </div>

  <script src="../js/polaris.js"></script>

</body>

</html>
