<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>07 / Lebewohl</title>

  <link
    rel="stylesheet"
    href="../css/global.css"
  >

  <link
    rel="stylesheet"
    href="../css/lebewohl.css"
  >
</head>

<body>

  <!--
      archive closed

      records_expected: 07
      records_verified: 07

      index complete
  -->

  <!-- 08 -->


  <main
    class="screen lebewohl-screen"
    id="lebewohlScreen"
  >

    <!--
        No RETURN button here.

        This is the only indexed archive
        that does not offer a way back.
    -->


    <div class="lebe-meta">
      FINAL RECORD
    </div>


    <!-- TITLE -->

    <section class="lebe-heading">

      <div class="archive-number">
        ARCHIVE 07
      </div>

      <h1>
        Lebewohl
      </h1>

      <div class="heading-line"></div>

    </section>


    <!-- FINAL RECORD -->

    <section class="final-record">

      <div class="record-count">
        07 / 07
      </div>

      <div class="record-statement">
        ALL RECORDS
        <br>
        ACCOUNTED FOR
      </div>

      <div class="record-line"></div>

      <div class="archive-state">
        <span>
          ARCHIVE STATUS
        </span>

        <span>
          COMPLETE
        </span>
      </div>


      <button
        class="close-archive-button"
        id="closeArchive"
        data-next="none"
        data-source="08"
      >
        CLOSE ARCHIVE
      </button>

    </section>


    <div class="lebe-bottom">
      INDEX COMPLETE
    </div>

  </main>



  <!-- =====================================================
       FINAL MESSAGE
       ===================================================== -->

  <div
    class="final-message-overlay"
    id="finalMessageOverlay"
  >

    <div class="final-message-window">

      <div
        class="final-message"
        id="finalMessage"
      ></div>

    </div>

  </div>



  <!-- =====================================================
       CLOSED STATE
       ===================================================== -->

  <div
    class="archive-closed-overlay"
    id="archiveClosedOverlay"
  >

    <div class="archive-closed-content">

      <div
        class="closed-heading"
        id="closedHeading"
      ></div>


      <div
        class="closed-records"
        id="closedRecords"
      ></div>


      <div
        class="closed-session"
        id="closedSession"
      ></div>


      <a
        class="closed-return"
        id="closedReturn"
        href="../index.html"
      >
        RETURN
      </a>

    </div>

  </div>


  <script src="../js/lebewohl.js"></script>

</body>

</html>
