<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Somewhere underneath all the noise</title>

  <link
    rel="stylesheet"
    href="css/global.css"
  >
</head>


<body>

  <!--

      Everything is where it should be.

      Except one.

  -->


  <!-- =====================================================
       HOME
       ===================================================== -->

  <main
    class="home-screen"
    id="homeScreen"
  >


    <!-- TOP LEFT -->

    <div class="home-label">
      PRIVATE ARCHIVE
    </div>


    <!-- TOP RIGHT -->

    <div class="home-meta">

      <div>
        07 FILES
      </div>

      <div class="meta-gap">
        LAST UPDATED
      </div>

      <div>
        03:17
      </div>

    </div>


    <!-- MAIN TITLE -->

    <section class="home-center">

      <div class="home-index">
        04.08
      </div>


      <div class="home-line"></div>


      <h1>
        Somewhere underneath
        <br>
        all the noise
      </h1>


      <button
        class="enter-button"
        id="enterArchive"
      >
        ENTER ARCHIVE
        <span>→</span>
      </button>

    </section>


    <!-- BOTTOM LEFT -->

    <div class="system-status">

      <span>
        SYSTEM STATUS
      </span>

      <span>
        NORMAL
      </span>

    </div>


    <!-- BOTTOM RIGHT -->

    <div
      class="jst-clock"
      id="jstClock"
    >
      --:--:-- JST
    </div>


    <!--
        This point exists from the beginning.

        Before Archive 07 is closed,
        it has no function.

        After Archive 07 is closed,
        its appearance remains unchanged.
    -->

    <button
      class="red-dot"
      id="redDot"
      aria-label=""
      tabindex="-1"
    ></button>


  </main>



  <!-- =====================================================
       ARCHIVE INDEX
       ===================================================== -->

  <main
    class="archive-index-screen"
    id="archiveIndex"
  >


    <!-- RETURN -->

    <button
      class="return-button index-return"
      id="returnHome"
    >
      <span>←</span>

      RETURN
    </button>


    <!-- TOP RIGHT -->

    <div class="index-meta">
      ARCHIVE INDEX
    </div>


    <!-- TITLE -->

    <section class="index-heading">

      <div class="index-small">
        PRIVATE ARCHIVE
      </div>

      <h2>
        INDEX
      </h2>

      <div class="index-heading-line"></div>

    </section>


    <!-- ARCHIVE LIST -->

    <section
      class="archive-list"
      id="archiveList"
    >
    </section>


    <!-- AVAILABILITY -->

    <div
      class="availability"
      id="availability"
    >
      01 / 07 AVAILABLE
    </div>


  </main>



  <script src="js/main.js"></script>

</body>

</html>
