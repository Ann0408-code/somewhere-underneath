<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>01 / CONTROL</title>

  <link
    rel="stylesheet"
    href="../css/global.css"
  >

  <link
    rel="stylesheet"
    href="../css/control.css"
  >
</head>


<body>

  <!--

      Everything is where it should be.

      Except one.

      item_08 removed

  -->


  <main class="screen control-screen">


    <!-- RETURN -->

    <a
      class="return-button"
      href="../index.html#archive"
    >
      <span class="return-arrow">←</span>
      RETURN
    </a>



    <!-- TOP META -->

    <div class="control-meta">
      RECORD 0408-C
    </div>



    <!-- LEFT SIDE -->

    <section class="control-left">


      <div class="archive-number">
        ARCHIVE 01
      </div>


      <h1 class="control-heading">
        CONTROL
      </h1>


      <div class="small-line"></div>


      <div class="inventory-label">
        PERSONAL EFFECTS / INVENTORY
      </div>



      <!-- INVENTORY -->

      <div class="inventory">


        <button
          class="inventory-row watch-row"
          data-object="watch"
        >

          <span class="object-number">
            01
          </span>

          <span class="object-name">
            WATCH
          </span>

          <span class="object-value">
            20:29
          </span>

          <span class="object-location">
            DESK / LEFT
          </span>

        </button>



        <button
          class="inventory-row"
          data-object="keys"
        >

          <span class="object-number">
            02
          </span>

          <span class="object-name">
            KEYS
          </span>

          <span class="object-value">
            —
          </span>

          <span class="object-location">
            TRAY / CENTER
          </span>

        </button>



        <button
          class="inventory-row"
          data-object="wallet"
        >

          <span class="object-number">
            03
          </span>

          <span class="object-name">
            WALLET
          </span>

          <span class="object-value">
            —
          </span>

          <span class="object-location">
            DRAWER / 01
          </span>

        </button>



        <button
          class="inventory-row"
          data-object="glasses"
        >

          <span class="object-number">
            04
          </span>

          <span class="object-name">
            GLASSES
          </span>

          <span class="object-value">
            —
          </span>

          <span class="object-location">
            DESK / RIGHT
          </span>

        </button>



        <button
          class="inventory-row"
          data-object="notebook"
        >

          <span class="object-number">
            05
          </span>

          <span class="object-name">
            NOTEBOOK
          </span>

          <span class="object-value">
            —
          </span>

          <span class="object-location">
            SHELF / 02
          </span>

        </button>



        <button
          class="inventory-row"
          data-object="pen"
        >

          <span class="object-number">
            06
          </span>

          <span class="object-name">
            PEN
          </span>

          <span class="object-value">
            —
          </span>

          <span class="object-location">
            DESK / LEFT
          </span>

        </button>



        <button
          class="inventory-row"
          data-object="headphones"
        >

          <span class="object-number">
            07
          </span>

          <span class="object-name">
            HEADPHONES
          </span>

          <span class="object-value">
            —
          </span>

          <span class="object-location">
            DRAWER / 02
          </span>

        </button>


      </div>



      <!-- STATUS -->

      <div class="inventory-status">

        <div class="status-heading">
          STATUS
        </div>


        <div class="status-grid">

          <span>
            7 OBJECTS
          </span>

          <span>
            7 REGISTERED
          </span>

          <span id="discrepancyCount">
            0 DISPLACED
          </span>

        </div>

      </div>


    </section>



    <!-- RIGHT SIDE / INSPECTOR -->

    <aside class="inspector">


      <div class="inspector-label">
        OBJECT INSPECTION
      </div>


      <div
        class="inspector-content"
        id="inspectorContent"
      >

        <div class="empty-inspection">

          SELECT AN OBJECT

        </div>

      </div>


    </aside>



    <!-- BOTTOM -->

    <div
      class="control-message"
      id="controlMessage"
    >
      Everything is where it should be.
    </div>



    <button
      class="report-button"
      id="reportButton"
    >
      REPORT DISCREPANCY
    </button>


  </main>



  <!-- REPORT MODAL -->

  <div
    class="report-overlay"
    id="reportOverlay"
  >

    <div class="report-window">


      <button
        class="close-report"
        id="closeReport"
      >
        ×
      </button>


      <div class="report-title">
        DISCREPANCY REPORT
      </div>



      <label>
        OBJECT ID
      </label>

      <input
        id="objectId"
        type="text"
        maxlength="2"
        autocomplete="off"
      >



      <label>
        DISCREPANCY
      </label>

      <input
        id="discrepancy"
        type="text"
        autocomplete="off"
      >



      <button
        class="submit-report"
        id="submitReport"
      >
        SUBMIT
      </button>



      <div
        class="report-response"
        id="reportResponse"
      ></div>


    </div>

  </div>



  <!-- COMPLETION -->

  <div
    class="completion-overlay"
    id="completionOverlay"
  >

    <div class="completion-text">

      <div id="completionLine1"></div>

      <div
        class="completion-main"
        id="completionLine2"
      ></div>

      <div
        class="completion-access"
        id="completionLine3"
      ></div>

    </div>

  </div>



  <script src="../js/control.js"></script>

</body>
</html>
